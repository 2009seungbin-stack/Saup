name: Restore Saup foundation

on:
  push:
    branches:
      - feat/commerce-foundation
    paths:
      - ".restore-v5/**"
      - ".github/workflows/restore-foundation.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout restore payload
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/commerce-foundation

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .restore-v5 -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 19
          cat .restore-v5/part-* | tr -d '\n\r' > /tmp/saup.b64
          base64 --decode /tmp/saup.b64 > /tmp/saup.tar.xz
          echo "4714da169f9b75e39e2375726b619cbccd3c31d56017f051eac0052c205899ab  /tmp/saup.tar.xz" | sha256sum -c -
          mkdir -p /tmp/saup-restore
          tar -xJf /tmp/saup.tar.xz -C /tmp/saup-restore
          test -f /tmp/saup-restore/pyproject.toml
          test -f /tmp/saup-restore/apps/api/main.py
          test -f /tmp/saup-restore/tests/test_workflows.py

      - name: Restore repository source
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/saup-restore/. .
          rm -rf .restore-v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Compile Python
        run: python -m compileall -q apps packages scripts migrations

      - name: Run test suite
        run: python -m pytest -q

      - name: Commit verified restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No restoration changes to commit."
            exit 0
          fi
          git commit -m "restore: verified commerce foundation source"
          git push origin HEAD:feat/commerce-foundation
