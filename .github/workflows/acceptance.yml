name: Phase 10 Docker acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase10-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: saup-acceptance-${{ github.run_id }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve exact tracked source before verification
        run: |
          mkdir -p reports/acceptance
          git rev-parse HEAD > reports/acceptance/source-sha.txt
          git status --porcelain=v1 > reports/acceptance/source-status-before.txt
          git archive --format=zip HEAD > reports/acceptance/source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: phase10-acceptance-source-${{ github.run_id }}
          path: |
            reports/acceptance/source.zip
            reports/acceptance/source-sha.txt
          if-no-files-found: error
      - name: Generate isolated demo credentials
        run: python scripts/bootstrap.py > /dev/null
      - name: Build real application images
        run: |
          set -o pipefail
          docker version > reports/acceptance/docker-version.txt
          docker compose version > reports/acceptance/compose-version.txt
          docker compose build --pull 2>&1 | tee reports/acceptance/docker-build.log
      - name: Start disposable stack and verify same-origin proxy
        run: |
          set -o pipefail
          docker compose up -d --wait --wait-timeout 180 2>&1 | tee reports/acceptance/compose-start.log
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost:8000/health > reports/acceptance/api-health.json
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost:3000/api/health > reports/acceptance/proxy-health.json
          curl --fail http://localhost:3000/ > /dev/null
      - name: Restart application processes without resetting data
        run: |
          set -o pipefail
          docker compose restart api worker web 2>&1 | tee reports/acceptance/compose-restart.log
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost:3000/api/health > reports/acceptance/proxy-health-after-restart.json
      - name: Collect diagnostics without environment secrets
        if: always()
        run: |
          docker compose ps -a --format json > reports/acceptance/compose-services.json || true
          docker compose logs --no-color > reports/acceptance/compose.log 2>&1 || true
          git status --porcelain=v1 > reports/acceptance/source-status-after.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase10-docker-acceptance-${{ github.run_id }}
          path: reports/acceptance/
          if-no-files-found: error
          retention-days: 14
      - name: Remove only this disposable test project
        if: always()
        run: docker compose down --volumes --remove-orphans
