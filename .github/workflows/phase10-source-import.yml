name: Phase 10 verified source import
on:
  push:
    branches: [feat/phase10-supplier-operations]
    paths: [.github/workflows/phase10-source-import.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify the fixed source bundle and apply only its declared paths
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess
          from pathlib import Path, PurePosixPath
          parts = [
              '9526054358d57c1f64f3a06241a5635f721bd533',
              '0cfcbbe642481d0f716d43799f95faa45085a5db',
              '63e639b14a78a78f26eb1d15f93dc9dfddd22ba7',
              '10e9c14d535fe972358ce3f8fe8e0e5a121ab97c',
              '78d7885d2dc499da031f41fec745b9af0a799480',
              'b19912cb7566deed418abc5a0311d33fde834960',
          ]
          def git_blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          encoded = b''
          for sha in parts:
              raw = subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}'])
              response = json.loads(raw)
              data = base64.b64decode(response['content'])
              assert git_blob(data) == sha and len(data) <= 14000, 'Transport blob mismatch'
              encoded += data
          assert len(encoded) == 80876
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '91d061b9a9bea28c3a3271ff5f25913e3ec557fb6ac04b4b9ec772b577d93419'
          decoder = lzma.LZMADecompressor(memlimit=256*1024*1024)
          decoded = decoder.decompress(compressed, max_length=1024*1024)
          assert decoder.eof and len(decoded) == 252449
          manifest = json.loads(decoded)
          base = '79df85d4c7e57df4a36f147b9a795644e723a36c'
          assert manifest['base'] == base and len(manifest['files']) == 49
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          prepared = {}
          for entry in manifest['files']:
              name = entry['path']; path = PurePosixPath(name)
              assert not path.is_absolute() and all(p not in ('..','.') and not p.startswith('.') for p in path.parts)
              assert path.parts[0] in {'apps','packages','migrations','tests','scripts','docs','docker','README.md','HANDOFF.md','ARCHITECTURE.md'}
              assert name not in {'packages/infrastructure/schema_v1.py','migrations/versions/0001_initial.py'}
              assert name not in prepared
              target = Path(name)
              assert not target.is_symlink() and all(not p.is_symlink() for p in target.parents)
              old = target.read_bytes() if target.exists() else None
              expected = entry['old']
              if name in {'README.md','HANDOFF.md'}:
                  expected = subprocess.check_output(['git','rev-parse',f'{base}:{name}'],text=True).strip()
              assert (git_blob(old) if old is not None else None) == expected, f'Concurrent/source change: {name}'
              if 'content' in entry:
                  output = entry['content'].encode('utf-8')
              else:
                  lines = old.decode('utf-8').splitlines(keepends=True)
                  end = len(lines)
                  for start, stop, replacement in reversed(entry['edits']):
                      assert 0 <= start <= stop <= end
                      lines[start:stop] = replacement.splitlines(keepends=True)
                      end = start
                  output = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(output).hexdigest() == entry['new'], f'Output mismatch: {name}'
              prepared[name] = output
          for name, content in prepared.items():
              Path(name).parent.mkdir(parents=True,exist_ok=True)
              Path(name).write_bytes(content)
          subprocess.run(['git','add','--',*prepared],check=True)
          report = Path(os.environ['RUNNER_TEMP'])/'phase10-publication'
          report.mkdir(exist_ok=True)
          (report/'source-manifest.json').write_text(json.dumps({p:hashlib.sha256(b).hexdigest() for p,b in prepared.items()},indent=2)+'\n')
          print(f'Verified and staged {len(prepared)} normal source files; no frozen migration or workflow files changed.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement Phase 10 explicit supplier Excel operations'
          git push origin HEAD:feat/phase10-supplier-operations
          git rev-parse HEAD > "$RUNNER_TEMP/phase10-publication/source-sha.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: phase10-source-publication
          path: ${{ runner.temp }}/phase10-publication/
          if-no-files-found: error
