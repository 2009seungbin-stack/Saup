[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "saup-commerce"
version = "0.1.0"
description = "Safety-first consignment commerce foundation"
requires-python = ">=3.12"
dependencies = [
 "fastapi==0.128.2", "uvicorn==0.40.0", "SQLAlchemy==2.0.50",
 "alembic==1.18.4", "pydantic==2.13.4", "pydantic-settings==2.14.1",
 "psycopg[binary]>=3.2,<4", "redis>=5.2,<7", "cryptography==46.0.4",
 "openpyxl==3.1.5", "defusedxml>=0.7.1,<1", "httpx==0.28.1",
 "python-multipart>=0.0.22,<1"
]
[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-cov>=6,<8"]
[tool.setuptools.packages.find]
include = ["apps*", "packages*", "scripts*", "migrations*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: requires a disposable PostgreSQL database", "redis: requires Redis"]
[tool.coverage.run]
source = ["packages", "apps/api", "apps/worker"]
